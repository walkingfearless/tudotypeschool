<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 355" width="800" height="355"><rect width="800" height="355" fill="white" stroke="#EBEBEB" stroke-width="1" rx="4"/><style>
.ltr{font-family:'Helvetica Neue', Helvetica, Arial, sans-serif;font-weight:800;fill:#111;}
