<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 375" width="800" height="375"><rect width="800" height="375" fill="white" stroke="#EBEBEB" stroke-width="1" rx="4"/><style>
.ltr{font-family:'Helvetica Neue', Helvetica, Arial, sans-serif;font-weight:800;fill:#111;}
.cap{font-family:'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:12px;fill:#555;letter-spacing:.07em;}
.capb{font-family:'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:12px;fill:#111;font-weight:700;letter-spacing:.07em;}
.capr{font-family:'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:12px;fill:#D63031;font-weight:700;letter-spacing:.07em;}
.capu{font-family:'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:12px;fill:#2D6BE4;font-weight:700;letter-spacing:.07em;}
.sm{font-family:'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:10px;fill:#888;}
</style>
  <text class="capb" x="400" y="22" text-anchor="middle">COMPENSAÇÃO ÓPTICA NAS INTERSECÇÕES</text>

  <!-- LEFT: no compensation — dark blotch at arch-stem join -->
  <path d="M70,135 Q70,55 145,70 Q220,55 220,135 L220,275 L184,275 L184,165 Q145,120 106,165 L106,275 L70,275 Z" fill="#111111"/>
  <!-- Red circle at the shoulder junction where arch meets left stem -->
  <circle cx="106" cy="135" r="28" fill="none" stroke="#D63031" stroke-width="2.5"/>
  <!-- leader line to label -->
  <line x1="128" y1="118" x2="185" y2="80" stroke="#D63031" stroke-width="1"/>
  <text class="capr" x="192" y="77" text-anchor="start">mancha escura</text>
  <text class="sm" x="192" y="92" text-anchor="start">(acumulação de tinta)</text>
  <line x1="50" y1="305" x2="370" y2="305" stroke="#DDDDDD" stroke-width="1"/>
  <text class="cap" x="210" y="320" text-anchor="middle">SEM COMPENSAÇÃO</text>
  <text class="sm" x="210" y="336" text-anchor="middle">junção com peso total</text>

  <line x1="390" y1="35" x2="390" y2="345" stroke="#DDDDDD" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- RIGHT: with compensation — notch at join reduces ink build-up -->
  <path d="M430,135 Q430,55 505,70 Q580,55 580,135 L580,275 L544,275 L544,165 Q505,120 466,165 L466,275 L430,275 Z" fill="#111111"/>
  <!-- Blue circle at the corrected junction -->
  <circle cx="466" cy="135" r="28" fill="none" stroke="#2D6BE4" stroke-width="2.5"/>
  <!-- small white wedge to show the compensation notch -->
  <polygon points="466,120 446,148 466,148" fill="white" opacity="0.6"/>
  <line x1="488" y1="118" x2="545" y2="80" stroke="#2D6BE4" stroke-width="1"/>
  <text class="capu" x="552" y="77" text-anchor="start">traço afinado</text>
  <text class="sm" x="552" y="92" text-anchor="start">(massa reduzida)</text>
  <line x1="410" y1="305" x2="650" y2="305" stroke="#DDDDDD" stroke-width="1"/>
  <text class="capb" x="570" y="320" text-anchor="middle">COM COMPENSAÇÃO</text>
  <text class="sm" x="570" y="336" text-anchor="middle">junção óptica corrigida</text>

  <text class="sm" x="400" y="360" text-anchor="middle">Essencial em tipografias de baixo contraste. Aplica-se ao ombro de n, h, m, u.</text>
</svg>