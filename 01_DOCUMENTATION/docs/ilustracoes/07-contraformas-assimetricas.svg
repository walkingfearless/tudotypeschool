<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" height="380"><rect width="800" height="380" fill="white" stroke="#EBEBEB" stroke-width="1" rx="4"/><style>
.ltr{font-family:'Helvetica Neue', Helvetica, Arial, sans-serif;font-weight:800;fill:#111;}
.cap{font-family:'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:12px;fill:#555;letter-spacing:.07em;}
.capb{font-family:'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:12px;fill:#111;font-weight:700;letter-spacing:.07em;}
.capr{font-family:'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:12px;fill:#D63031;font-weight:700;letter-spacing:.07em;}
.capu{font-family:'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:12px;fill:#2D6BE4;font-weight:700;letter-spacing:.07em;}
.sm{font-family:'Helvetica Neue', Helvetica, Arial, sans-serif;font-size:10px;fill:#888;}
</style>
  <text class="capb" x="400" y="22" text-anchor="middle">CONTRAFORMAS ASSIMÉTRICAS — B, S, P, R</text>

  <!-- LEFT: equal counters (wrong) -->
  <!-- outer frame -->
  <rect x="80" y="50" width="200" height="280" fill="none" stroke="#888888" stroke-width="1.5" rx="3"/>
  <!-- true midpoint line -->
  <line x1="80" y1="190" x2="280" y2="190" stroke="#888888" stroke-width="1" stroke-dasharray="4 3"/>
  <!-- counter fills -->
  <rect x="80" y="50" width="200" height="140" fill="#888888" opacity="0.12" rx="2"/>
  <rect x="80" y="190" width="200" height="140" fill="#888888" opacity="0.18" rx="2"/>
  <!-- equal-size label -->
  <text class="cap" x="180" y="120" text-anchor="middle">140 u</text>
  <text class="cap" x="180" y="258" text-anchor="middle">140 u</text>
  <text class="sm" x="180" y="192" text-anchor="start">← ponto médio real</text>
  <line x1="80" y1="332" x2="280" y2="332" stroke="#DDDDDD" stroke-width="1"/>
  <text class="cap" x="180" y="348" text-anchor="middle">ERRADO</text>
  <text class="sm" x="180" y="364" text-anchor="middle">contraformas iguais → pesado em baixo</text>

  <line x1="390" y1="35" x2="390" y2="370" stroke="#DDDDDD" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- RIGHT: asymmetric counters (correct) -->
  <rect x="430" y="50" width="200" height="280" fill="none" stroke="#111111" stroke-width="1.5" rx="3"/>
  <!-- optical split above midpoint -->
  <line x1="430" y1="160" x2="630" y2="160" stroke="#D63031" stroke-width="1" stroke-dasharray="4 3"/>
  <!-- counter fills -->
  <rect x="430" y="50" width="200" height="110" fill="#D63031" opacity="0.10" rx="2"/>
  <rect x="430" y="160" width="200" height="170" fill="#2D6BE4" opacity="0.10" rx="2"/>
  <text class="capr" x="530" y="105" text-anchor="middle">110 u</text>
  <text class="capu" x="530" y="250" text-anchor="middle">170 u</text>
  <text class="capr" x="540" y="158" text-anchor="middle">barra acima do centro ↑</text>
  <line x1="430" y1="332" x2="630" y2="332" stroke="#DDDDDD" stroke-width="1"/>
  <text class="capb" x="530" y="348" text-anchor="middle">CORRECTO</text>
  <text class="sm" x="530" y="364" text-anchor="middle">contraforma superior  <  inferior</text>
</svg>